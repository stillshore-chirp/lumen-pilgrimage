<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">歩行者視点で保持すべき信号</title>
  <desc id="desc">真のジオメトリ、テクスチャ、インポスタを、両眼視差、形状階層、PBR入力、LODの判定で結び付けた図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30465f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3394c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287a66"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dbe3eb" stroke-width="1"/>
    </pattern>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d6d0c3"/>
      <stop offset="1" stop-color="#a79c8b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f1f3" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#4e8992" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b67a3a"/>
      <stop offset="0.5" stop-color="#75421f"/>
      <stop offset="1" stop-color="#d29b56"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e2d4c2"/>
      <stop offset="1" stop-color="#9d8c79"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #b9c6d3; stroke-width: 2; }
      .section { fill: #edf3f7; stroke: #b9c6d3; stroke-width: 1.5; }
      .title { font-family: Inter, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 24px; font-weight: 700; fill: #182737; }
      .sub { font-family: Inter, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 16px; font-weight: 700; fill: #30465f; }
      .label { font-family: Inter, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 15px; fill: #253646; }
      .small { font-family: Inter, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 13px; fill: #435363; }
      .tiny { font-family: Inter, 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 12px; fill: #435363; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #1e344a; }
      .rule { stroke: #30465f; stroke-width: 2; fill: none; }
      .soft-rule { stroke: #8ea0b2; stroke-width: 1.5; fill: none; }
      .warn { fill: #fff1f2; stroke: #b3394c; stroke-width: 1.5; }
      .ok { fill: #edf8f4; stroke: #287a66; stroke-width: 1.5; }
      .tag-geom { fill: #dce9f5; stroke: #527b9e; stroke-width: 1; }
      .tag-map { fill: #f2ead7; stroke: #a38342; stroke-width: 1; }
      .tag-far { fill: #e8e9ed; stroke: #777f8d; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="40" y="43">歩行者視点で保持すべき信号</text>
  <text class="small" x="40" y="70">形状階層を、視差・接触・PBR入力・LODの一つの診断系として設計する</text>

  <!-- A: stereo and truth -->
  <rect class="panel" x="35" y="95" width="425" height="455" rx="12"/>
  <text class="sub" x="58" y="130">A　観察者の運動が表す真偽</text>
  <text class="small" x="58" y="153">カードに描いた奥行きは、両眼の平面を越えられない</text>
  <rect class="section" x="58" y="175" width="379" height="205" rx="8"/>
  <path d="M 83 337 L 414 337" stroke="#30465f" stroke-width="3"/>
  <path d="M 83 337 L 83 235 L 155 235 L 205 280 L 259 230 L 334 230 L 334 337" fill="url(#stone)" stroke="#596a78" stroke-width="2"/>
  <path d="M 155 235 L 205 280 L 205 337" fill="none" stroke="#596a78" stroke-width="2"/>
  <path d="M 205 280 L 259 230" fill="none" stroke="#596a78" stroke-width="2"/>
  <path d="M 259 230 L 259 337" fill="none" stroke="#596a78" stroke-width="2"/>
  <text class="tiny" x="91" y="359">床</text>
  <text class="tiny" x="211" y="299">実際の凹み</text>
  <circle cx="105" cy="205" r="7" fill="#b3394c"/>
  <circle cx="137" cy="205" r="7" fill="#b3394c"/>
  <text class="tiny" x="82" y="192">左眼</text>
  <text class="tiny" x="133" y="192">右眼</text>
  <path d="M 105 205 L 215 280" stroke="#b3394c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M 137 205 L 250 280" stroke="#b3394c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M 105 205 L 300 230" stroke="#287a66" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M 137 205 L 315 230" stroke="#287a66" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text class="tiny" x="274" y="214" fill="#287a66">同じ実面へ収束</text>
  <rect class="warn" x="70" y="397" width="360" height="55" rx="6"/>
  <text class="label" x="84" y="420">インポスタの限界</text>
  <text class="tiny" x="84" y="440">頭部移動で、描かれた奥行きと遮蔽がずれる。</text>
  <text class="mono" x="70" y="484">Δu ≈ f b / z</text>
  <text class="small" x="70" y="508">b=.064 m, f=800 px → z=1 m: 51 px / z=10 m: 5.1 px</text>
  <rect class="tag-geom" x="70" y="520" width="109" height="24" rx="12"/>
  <text class="tiny" x="83" y="537">近距離は形状</text>
  <rect class="tag-far" x="187" y="520" width="112" height="24" rx="12"/>
  <text class="tiny" x="200" y="537">遠距離は代理可</text>

  <!-- B: hierarchy -->
  <rect class="panel" x="480" y="95" width="430" height="455" rx="12"/>
  <text class="sub" x="503" y="130">B　形状階層：証拠を保持</text>
  <text class="small" x="503" y="153">三角形の数ではなく、変化する関係を置く</text>
  <rect class="section" x="503" y="175" width="384" height="272" rx="8"/>
  <rect x="532" y="202" width="188" height="55" rx="5" fill="#aebdca" stroke="#52697e"/>
  <path d="M 556 244 L 592 212 L 634 244 L 674 212 L 699 244" fill="none" stroke="#30465f" stroke-width="3"/>
  <text class="label" x="734" y="224">主形状</text>
  <text class="tiny" x="734" y="244">輪郭・開口・床・階段</text>
  <rect x="532" y="270" width="188" height="55" rx="5" fill="#d6d0c3" stroke="#8b806f"/>
  <path d="M 548 270 L 548 325 M 670 270 L 670 325" stroke="#8b806f" stroke-width="2"/>
  <path d="M 532 316 L 720 316" stroke="#b67a3a" stroke-width="7"/>
  <text class="label" x="734" y="292">接触・端部</text>
  <text class="tiny" x="734" y="312">敷居・段鼻・面取り</text>
  <rect x="532" y="338" width="188" height="44" rx="5" fill="url(#stone)" stroke="#8b806f"/>
  <path d="M 548 338 L 548 382 M 597 338 L 597 382 M 646 338 L 646 382 M 695 338 L 695 382" stroke="#8b806f" stroke-width="2"/>
  <text class="label" x="734" y="356">中周波</text>
  <text class="tiny" x="734" y="376">目地・板・パネル</text>
  <rect x="532" y="395" width="188" height="32" rx="5" fill="#d8e1d5" stroke="#6e8e74"/>
  <path d="M 540 401 L 715 421 M 540 421 L 715 401" stroke="#6e8e74" stroke-width="1.2" opacity="0.8"/>
  <text class="label" x="734" y="410">微細</text>
  <text class="tiny" x="734" y="430">孔・繊維・粗さ</text>
  <path d="M 516 209 L 516 257" stroke="#527b9e" stroke-width="5"/>
  <path d="M 516 270 L 516 325" stroke="#527b9e" stroke-width="5"/>
  <path d="M 516 338 L 516 382" stroke="#a38342" stroke-width="5"/>
  <path d="M 516 395 L 516 427" stroke="#a38342" stroke-width="5"/>
  <text class="tiny" x="529" y="465">青:実ジオメトリ　黄:実寸UV＋マップ</text>
  <rect class="warn" x="510" y="474" width="362" height="52" rx="6"/>
  <text class="label" x="525" y="496">12 mmの端部が2〜3 texelなら</text>
  <text class="tiny" x="525" y="516">マップで描かず、端部を形状へ戻す。</text>

  <!-- C: PBR pipeline -->
  <rect class="panel" x="930" y="95" width="435" height="455" rx="12"/>
  <text class="sub" x="953" y="130">C　PBR入力 → 応答</text>
  <text class="small" x="953" y="153">色の意味と線形データを同じRGBにしない</text>
  <rect class="section" x="953" y="178" width="168" height="210" rx="8"/>
  <text class="label" x="971" y="203">入力</text>
  <rect x="969" y="217" width="133" height="31" rx="5" fill="#d8aa91" stroke="#8b5f4b"/>
  <text class="tiny" x="981" y="237">baseColor sRGB</text>
  <path d="M 1035 248 L 1035 266" class="soft-rule" marker-end="url(#arrow)"/>
  <text class="tiny" x="974" y="281">→ decode to linear</text>
  <rect x="969" y="294" width="133" height="31" rx="5" fill="#c4d2ea" stroke="#527b9e"/>
  <text class="tiny" x="976" y="314">normal / roughness</text>
  <rect x="969" y="336" width="133" height="31" rx="5" fill="#c4d2ea" stroke="#527b9e"/>
  <text class="tiny" x="978" y="356">metalness / AO: linear</text>
  <path d="M 1121 283 L 1175 283" class="rule" marker-end="url(#arrow)"/>
  <circle cx="1222" cy="283" r="53" fill="#e7eef3" stroke="#527b9e" stroke-width="2"/>
  <text class="label" x="1193" y="278">GGX</text>
  <text class="tiny" x="1182" y="297">F · D · G</text>
  <text class="mono" x="1154" y="365">α = r²</text>
  <text class="mono" x="1154" y="388">F₀=.04 (η=1.5)</text>
  <path d="M 1275 283 L 1328 283" class="rule" marker-end="url(#arrow)"/>
  <rect x="1288" y="200" width="60" height="31" rx="5" fill="url(#stone)" stroke="#8b806f"/>
  <text class="tiny" x="1301" y="220">石</text>
  <rect x="1288" y="241" width="60" height="31" rx="5" fill="url(#glass)" stroke="#4e8992"/>
  <text class="tiny" x="1301" y="261">ガラス</text>
  <rect x="1288" y="282" width="60" height="31" rx="5" fill="url(#bronze)" stroke="#75421f"/>
  <text class="tiny" x="1301" y="302">青銅</text>
  <rect x="1288" y="323" width="60" height="31" rx="5" fill="url(#fabric)" stroke="#9d8c79"/>
  <text class="tiny" x="1301" y="343">布</text>
  <rect class="warn" x="953" y="411" width="395" height="82" rx="6"/>
  <text class="label" x="968" y="435">黒い面の第一診断</text>
  <text class="tiny" x="968" y="456">法線 → tangent.w/UV → 非色テクスチャ色空間</text>
  <text class="tiny" x="968" y="475">プラスチック化は、端部・粗さ・sRGB計算を確認</text>

  <!-- LOD strip -->
  <rect class="panel" x="35" y="580" width="1330" height="270" rx="12"/>
  <text class="sub" x="58" y="616">D　LOD切り替えの基準は視差・接触・属性</text>
  <text class="small" x="58" y="640">近景の信号を消して軽くすることは、歩ける建築の品質を下げるだけである</text>

  <rect class="tag-geom" x="75" y="672" width="235" height="95" rx="8"/>
  <text class="label" x="94" y="699">LOD0　近景</text>
  <text class="tiny" x="94" y="721">輪郭・厚み・接触</text>
  <text class="tiny" x="94" y="741">実形状＋normal＋roughness</text>
  <text class="tiny" x="94" y="761">両眼と頭部移動で検証</text>
  <path d="M 310 720 L 397 720" class="rule" marker-end="url(#arrow)"/>

  <rect class="tag-map" x="415" y="672" width="275" height="95" rx="8"/>
  <text class="label" x="434" y="699">LOD1　中距離</text>
  <text class="tiny" x="434" y="721">微細形状をマップへ移す</text>
  <text class="tiny" x="434" y="741">ベベル・材質境界・UVは保持</text>
  <text class="tiny" x="434" y="761">画面誤差と密度を照合</text>
  <path d="M 690 720 L 777 720" class="rule" marker-end="url(#arrow)"/>

  <rect class="tag-far" x="795" y="672" width="230" height="95" rx="8"/>
  <text class="label" x="814" y="699">LOD2　遠景</text>
  <text class="tiny" x="814" y="721">簡略メッシュ／インポスタ</text>
  <text class="tiny" x="814" y="741">視差誤差が予算内の場所だけ</text>
  <text class="tiny" x="814" y="761">歩行経路から隔離</text>
  <path d="M 1025 720 L 1112 720" class="rule" marker-end="url(#arrow-green)"/>

  <rect class="ok" x="1130" y="672" width="210" height="95" rx="8"/>
  <text class="label" x="1149" y="699">受入</text>
  <text class="tiny" x="1149" y="721">接点が跳ばない</text>
  <text class="tiny" x="1149" y="741">黒い筋が出ない</text>
  <text class="tiny" x="1149" y="761">ハイライトが端へ付着</text>

  <path d="M 75 795 L 1328 795" stroke="#b9c6d3" stroke-width="1.5"/>
  <text class="tiny" x="76" y="820">保存する証拠：</text>
  <text class="tiny" x="172" y="820">ワイヤーフレーム（形状）</text>
  <text class="tiny" x="382" y="820">法線／tangent（陰影）</text>
  <text class="tiny" x="592" y="820">UVとミップ（サンプリング）</text>
  <text class="tiny" x="847" y="820">左右眼＋連続移動（XR）</text>
  <text class="tiny" x="1088" y="820">同一照明（比較条件）</text>
</svg>
