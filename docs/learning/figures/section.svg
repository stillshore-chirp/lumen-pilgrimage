<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">平面・断面・立面を同じ基準で読むアトリウム図</title>
  <desc id="desc">左上は六メートルのベイが並ぶ平面図。中央に幅十二メートルのボイド、左右にアーケード、ボイドを横切る二本の橋、縁の座席がある。右上は断面図で、三層の床スラブ、ソフィット、橋、階段、目の高さ一・六メートルから橋へ向かう視線を示す。下段は柱と床帯が反復する立面図である。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#176b87"/>
    </marker>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M0,3.5 L7,0 L7,7 Z" fill="#6a3d2e"/>
    </marker>
    <style>
      .frame{fill:#fbfaf7;stroke:#25323a;stroke-width:2}
      .cut{fill:#d6d2c7;stroke:#25323a;stroke-width:2}
      .floor{fill:#b9c5c3;stroke:#25323a;stroke-width:2}
      .void{fill:#f3efe5;stroke:#176b87;stroke-width:3}
      .bridge{fill:#d5b673;stroke:#604c26;stroke-width:2}
      .arcade{fill:#e9d8ce;stroke:#7d4e46;stroke-width:2}
      .seat{fill:#7c9a83;stroke:#31563b;stroke-width:1.5}
      .stair{stroke:#8d5b3f;stroke-width:2;fill:none}
      .label{font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif;fill:#25323a;font-size:19px}
      .small{font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif;fill:#25323a;font-size:15px}
      .dimtxt{font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif;fill:#6a3d2e;font-size:15px}
      .sight{stroke:#176b87;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
      .datum{stroke:#6a3d2e;stroke-width:1.4;marker-start:url(#dim);marker-end:url(#dim)}
      .grid{stroke:#84979a;stroke-width:1;stroke-dasharray:4 5}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ece8df"/>
  <text x="40" y="42" class="label" font-weight="700">同じ基準線で読む — retail atrium / 断面の判断を平面へ戻す</text>

  <!-- plan -->
  <rect x="40" y="68" width="535" height="300" class="frame"/>
  <text x="60" y="98" class="label" font-weight="700">平面　PLAN</text>
  <text x="60" y="122" class="small">6.0 m ベイ × 3　　中央ボイド 12.0 m</text>
  <line x1="112" y1="142" x2="112" y2="348" class="grid"/>
  <line x1="212" y1="142" x2="212" y2="348" class="grid"/>
  <line x1="312" y1="142" x2="312" y2="348" class="grid"/>
  <line x1="412" y1="142" x2="412" y2="348" class="grid"/>
  <line x1="512" y1="142" x2="512" y2="348" class="grid"/>
  <rect x="74" y="146" width="88" height="188" class="arcade"/>
  <rect x="468" y="146" width="88" height="188" class="arcade"/>
  <rect x="177" y="146" width="274" height="188" class="void"/>
  <text x="269" y="230" class="label" text-anchor="middle" fill="#176b87">ボイド</text>
  <text x="269" y="253" class="small" text-anchor="middle">光・音・視線の縦軸</text>
  <rect x="194" y="188" width="240" height="22" class="bridge"/>
  <rect x="194" y="272" width="240" height="22" class="bridge"/>
  <text x="312" y="181" class="small" text-anchor="middle">bridge</text>
  <circle cx="203" cy="230" r="13" class="seat"/><circle cx="425" cy="230" r="13" class="seat"/>
  <circle cx="203" cy="249" r="13" class="seat"/><circle cx="425" cy="249" r="13" class="seat"/>
  <text x="118" y="335" class="small" text-anchor="middle">アーケード</text>
  <text x="512" y="335" class="small" text-anchor="middle">アーケード</text>
  <line x1="177" y1="350" x2="451" y2="350" class="datum"/>
  <text x="314" y="365" class="dimtxt" text-anchor="middle">12.0 m</text>
  <line x1="162" y1="142" x2="162" y2="334" class="datum"/>
  <text x="153" y="245" class="dimtxt" transform="rotate(-90 153 245)" text-anchor="middle">18.0 m</text>

  <!-- section -->
  <rect x="605" y="68" width="555" height="300" class="frame"/>
  <text x="625" y="98" class="label" font-weight="700">断面　SECTION</text>
  <text x="625" y="122" class="small">床・スラブ・ソフィット・視線を一つの鉛直基準へ</text>
  <g transform="translate(0,28)">
  <line x1="660" y1="325" x2="1125" y2="325" class="grid"/>
  <rect x="690" y="275" width="405" height="20" class="floor"/>
  <rect x="690" y="196" width="405" height="20" class="floor"/>
  <rect x="690" y="117" width="405" height="20" class="floor"/>
  <rect x="690" y="295" width="405" height="12" class="cut"/>
  <rect x="690" y="216" width="405" height="12" class="cut"/>
  <rect x="690" y="137" width="405" height="12" class="cut"/>
  <rect x="760" y="216" width="180" height="18" class="bridge"/>
  <line x1="760" y1="234" x2="760" y2="275" stroke="#604c26" stroke-width="2"/>
  <line x1="940" y1="234" x2="940" y2="275" stroke="#604c26" stroke-width="2"/>
  <path d="M705 275 l15 -10 l15 10 l15 -10 l15 10 l15 -10 l15 10" class="stair"/>
  <path d="M705 275 l15 -10 l15 10 l15 -10 l15 10" class="stair" transform="translate(0,-79)"/>
  <line x1="720" y1="270" x2="720" y2="170" stroke="#7d4e46" stroke-width="2"/>
  <line x1="705" y1="155" x2="705" y2="115" stroke="#7d4e46" stroke-width="2"/>
  <circle cx="720" cy="260" r="5" fill="#176b87"/>
  <path d="M720 260 L850 224" class="sight"/>
  <text x="735" y="247" class="small" fill="#176b87">目 1.6 m</text>
  <text x="850" y="213" class="small" fill="#176b87">橋の上端 5.2 m</text>
  <text x="1010" y="190" class="small">ソフィット</text>
  <line x1="1000" y1="196" x2="1000" y2="216" stroke="#25323a" stroke-width="1.5"/>
  <text x="1008" y="287" class="small">スラブ</text>
  <line x1="990" y1="285" x2="990" y2="295" stroke="#25323a" stroke-width="1.5"/>
  <line x1="1098" y1="275" x2="1098" y2="325" class="datum"/>
  <text x="1112" y="304" class="dimtxt" transform="rotate(-90 1112 304)" text-anchor="middle">1階床 +0.00</text>
  <line x1="665" y1="275" x2="665" y2="325" class="datum"/>
  <text x="650" y="304" class="dimtxt" transform="rotate(-90 650 304)" text-anchor="middle">視点高さ</text>
  </g>

  <!-- elevation -->
  <rect x="40" y="405" width="1120" height="310" class="frame"/>
  <text x="60" y="435" class="label" font-weight="700">立面　ELEVATION</text>
  <text x="60" y="459" class="small">ベイの反復、床帯、開口の高さを外側から確認する</text>
  <line x1="85" y1="667" x2="1115" y2="667" stroke="#25323a" stroke-width="2"/>
  <rect x="85" y="592" width="1030" height="18" class="floor"/>
  <rect x="85" y="517" width="1030" height="18" class="floor"/>
  <rect x="85" y="442" width="1030" height="18" class="floor"/>
  <g fill="#dbe6e1" stroke="#25323a" stroke-width="2">
    <rect x="112" y="462" width="74" height="55"/><rect x="212" y="462" width="74" height="55"/><rect x="312" y="462" width="74" height="55"/><rect x="412" y="462" width="74" height="55"/><rect x="512" y="462" width="74" height="55"/><rect x="612" y="462" width="74" height="55"/><rect x="712" y="462" width="74" height="55"/><rect x="812" y="462" width="74" height="55"/><rect x="912" y="462" width="74" height="55"/><rect x="1012" y="462" width="74" height="55"/>
    <rect x="112" y="537" width="74" height="55"/><rect x="212" y="537" width="74" height="55"/><rect x="312" y="537" width="74" height="55"/><rect x="412" y="537" width="74" height="55"/><rect x="512" y="537" width="74" height="55"/><rect x="612" y="537" width="74" height="55"/><rect x="712" y="537" width="74" height="55"/><rect x="812" y="537" width="74" height="55"/><rect x="912" y="537" width="74" height="55"/><rect x="1012" y="537" width="74" height="55"/>
    <rect x="112" y="612" width="74" height="55"/><rect x="212" y="612" width="74" height="55"/><rect x="312" y="612" width="74" height="55"/><rect x="412" y="612" width="74" height="55"/><rect x="512" y="612" width="74" height="55"/><rect x="612" y="612" width="74" height="55"/><rect x="712" y="612" width="74" height="55"/><rect x="812" y="612" width="74" height="55"/><rect x="912" y="612" width="74" height="55"/><rect x="1012" y="612" width="74" height="55"/>
  </g>
  <g fill="#8d6b51" stroke="#5f4735" stroke-width="1.5">
    <rect x="92" y="442" width="20" height="225"/><rect x="192" y="442" width="20" height="225"/><rect x="292" y="442" width="20" height="225"/><rect x="392" y="442" width="20" height="225"/><rect x="492" y="442" width="20" height="225"/><rect x="592" y="442" width="20" height="225"/><rect x="692" y="442" width="20" height="225"/><rect x="792" y="442" width="20" height="225"/><rect x="892" y="442" width="20" height="225"/><rect x="992" y="442" width="20" height="225"/><rect x="1092" y="442" width="20" height="225"/>
  </g>
  <path d="M600 600 C650 560, 700 560, 750 520" class="sight"/>
  <text x="615" y="648" class="small" fill="#176b87">反復する床帯と柱列が、内部の空隙の額縁になる</text>
  <line x1="92" y1="687" x2="192" y2="687" class="datum"/>
  <text x="142" y="708" class="dimtxt" text-anchor="middle">6.0 m ベイ</text>
  <line x1="192" y1="687" x2="292" y2="687" class="datum"/>
  <text x="242" y="708" class="dimtxt" text-anchor="middle">6.0 m ベイ</text>
  <text x="805" y="708" class="small">図中の色：床帯 / ボイド / 橋 / アーケード / 座席</text>
</svg>
