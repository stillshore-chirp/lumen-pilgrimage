<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">合成カメラによる写真の投影読解</title>
  <desc id="desc">左に世界座標の基準面、カメラ、鉛直対象を描き、右に画像面、基準面の消失線、鉛直消失点、対象と既知基準の像を描く。数値は本文の合成例と同じで、外部画像を使わない。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#253449"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d5f8a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b8443b"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b4ca2"/>
    </marker>
    <style>
      .panel { fill:#fbfcfe; stroke:#c5ced8; stroke-width:1.5; }
      .heading { fill:#172233; font-family:"Hiragino Sans","Yu Gothic",sans-serif; font-size:18px; font-weight:700; }
      .label { fill:#253449; font-family:"Hiragino Sans","Yu Gothic",sans-serif; font-size:14px; }
      .small { fill:#42546a; font-family:"Hiragino Sans","Yu Gothic",sans-serif; font-size:12px; }
      .tiny { fill:#42546a; font-family:"Hiragino Sans","Yu Gothic",sans-serif; font-size:11px; }
      .mono { fill:#253449; font-family:"SFMono-Regular","Menlo",monospace; font-size:12px; }
      .world-line { fill:none; stroke:#253449; stroke-width:2; }
      .sight { fill:none; stroke:#6b4ca2; stroke-width:1.8; stroke-dasharray:7 6; }
      .ground { fill:#e6f0f5; stroke:#1d5f8a; stroke-width:2; }
      .target { fill:#f8d9d3; stroke:#b8443b; stroke-width:2; }
      .reference { fill:#e9e0f5; stroke:#6b4ca2; stroke-width:2; }
      .image-border { fill:#fff; stroke:#253449; stroke-width:2; }
      .axis { fill:none; stroke:#253449; stroke-width:1.6; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="34" class="heading">写真を読むための投影図：同じ合成カメラを二つの面で見る</text>
  <text x="40" y="58" class="small">座標規約：X は右、Y は上、Z は基準面から前方。画像座標は中心原点で x 右・y 上。</text>

  <rect x="30" y="78" width="500" height="492" rx="8" class="panel"/>
  <rect x="550" y="78" width="420" height="492" rx="8" class="panel"/>
  <text x="54" y="108" class="heading">三次元の合成シーン</text>
  <text x="574" y="108" class="heading">画像面での観測</text>

  <!-- world panel: ground plane and axes -->
  <polygon points="118,444 370,350 512,400 230,520" class="ground"/>
  <line x1="146" y1="437" x2="456" y2="383" class="world-line" marker-end="url(#arrow-blue)"/>
  <text x="457" y="380" class="label">X（右）</text>
  <line x1="224" y1="506" x2="418" y2="367" class="world-line" marker-end="url(#arrow-blue)"/>
  <text x="422" y="361" class="label">Z（前方）</text>
  <line x1="118" y1="444" x2="118" y2="382" class="axis" marker-end="url(#arrow-dark)"/>
  <text x="91" y="377" class="label">Y（上）</text>
  <text x="82" y="545" class="small">基準面：Y = 0</text>

  <!-- camera and optical rays -->
  <circle cx="91" cy="330" r="9" fill="#253449"/>
  <text x="48" y="306" class="label">C</text>
  <text x="47" y="322" class="tiny">(0, 2, −4)</text>
  <line x1="100" y1="330" x2="528" y2="330" class="sight" marker-end="url(#arrow-violet)"/>
  <text x="138" y="318" class="small">視線前方 s &gt; 0</text>

  <!-- target and known reference -->
  <line x1="340" y1="390" x2="340" y2="212" class="target" marker-end="url(#arrow-red)"/>
  <circle cx="340" cy="390" r="5" fill="#b8443b"/>
  <circle cx="340" cy="212" r="5" fill="#b8443b"/>
  <text x="352" y="394" class="label">B（足元）</text>
  <text x="352" y="210" class="label">T（頂点）</text>
  <text x="350" y="232" class="small">対象の鉛直線</text>
  <line x1="425" y1="380" x2="425" y2="260" class="reference" marker-end="url(#arrow-violet)"/>
  <circle cx="425" cy="380" r="5" fill="#6b4ca2"/>
  <circle cx="425" cy="260" r="5" fill="#6b4ca2"/>
  <text x="436" y="260" class="small">床上の基準点</text>
  <text x="436" y="276" class="tiny">既知の奥行きで尺度を決める</text>
  <line x1="91" y1="330" x2="340" y2="390" class="sight"/>
  <line x1="91" y1="330" x2="340" y2="212" class="sight"/>
  <line x1="91" y1="330" x2="425" y2="380" class="sight"/>
  <line x1="91" y1="330" x2="425" y2="260" class="sight"/>
  <text x="144" y="463" class="tiny">輪郭・遮蔽・支持面を別々に観測する</text>

  <!-- image panel -->
  <rect x="610" y="130" width="330" height="360" class="image-border"/>
  <text x="621" y="148" class="tiny">中心原点の画像座標（図示用の縮尺）</text>
  <line x1="625" y1="330" x2="928" y2="330" class="axis" marker-end="url(#arrow-dark)"/>
  <line x1="785" y1="470" x2="785" y2="155" class="axis" marker-end="url(#arrow-dark)"/>
  <text x="934" y="335" class="label">x</text>
  <text x="791" y="166" class="label">y</text>

  <!-- ground-plane vanishing line -->
  <line x1="615" y1="205" x2="935" y2="205" stroke="#1d5f8a" stroke-width="3"/>
  <text x="623" y="195" class="label" fill="#1d5f8a">l：基準面の消失線（y = 500）</text>

  <!-- vertical vanishing point and direction -->
  <circle cx="785" cy="545" r="6" fill="#6b4ca2"/>
  <text x="794" y="550" class="label">v = (0, −2000)</text>
  <line x1="785" y1="545" x2="665" y2="250" class="sight"/>
  <line x1="785" y1="545" x2="700" y2="360" class="sight"/>
  <line x1="785" y1="545" x2="930" y2="262" class="sight"/>

  <!-- target projection -->
  <line x1="700" y1="360" x2="665" y2="250" class="target" stroke-width="3"/>
  <circle cx="700" cy="360" r="6" fill="#b8443b"/>
  <circle cx="665" cy="250" r="6" fill="#b8443b"/>
  <text x="706" y="365" class="label">b</text>
  <text x="649" y="242" class="label">t</text>
  <text x="621" y="382" class="small">対象像：b → t</text>

  <!-- reference projection -->
  <line x1="930" y1="262" x2="900" y2="360" class="reference" stroke-width="3"/>
  <circle cx="900" cy="360" r="6" fill="#6b4ca2"/>
  <circle cx="930" cy="262" r="6" fill="#6b4ca2"/>
  <text x="907" y="365" class="label">bᵣ</text>
  <text x="934" y="258" class="label">tᵣ</text>
  <text x="824" y="390" class="small">既知 4.000 m</text>

  <!-- numeric legend -->
  <rect x="574" y="505" width="372" height="52" rx="5" fill="#f1f4f8" stroke="#d2d9e1"/>
  <text x="586" y="523" class="mono">C=(0,2,−4), f=1000, 歪み=0</text>
  <text x="586" y="541" class="mono">B=(−1,0,5), T=(−1,1.5,5) → Z=5.000 m, Y=1.500 m</text>

  <line x1="54" y1="560" x2="506" y2="560" stroke="#c5ced8"/>
  <text x="54" y="563" class="tiny">紫：投影光線　青：基準面・消失線　赤：対象　薄紫：尺度の基準</text>
</svg>
