<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="354" viewBox="0 0 1120 354" role="img" aria-labelledby="title description">
  <title id="title">奥棚Bを移設した位置の奥行き方向の検図</title>
  <desc id="description">共用通路から見える小物売場の奥棚B。店内主通路の奥端は d=9.525 m、棚は d=9.560 m から d=9.980 m、奥壁の仕上げ面は d=10.020 m。棚の手前に35 mm、棚の背後に40 mmの隙間がある。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#485952"/>
    </marker>
    <style>
      text {font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; fill:#273733}
      .heading {font-size:24px; font-weight:650}
      .label {font-size:20px; font-weight:620}
      .small {font-size:17px}
      .gap {font-size:17px; font-weight:620}
      .dim {fill:none; stroke:#485952; stroke-width:1.6}
      .guide {fill:none; stroke:#a4afa9; stroke-width:1.2; stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="354" fill="#f6f6f0"/>
  <rect x="22" y="22" width="1076" height="310" rx="12" fill="#fff" stroke="#d1d8d1"/>
  <text class="heading" x="52" y="64">奥棚Bの配置を、通路と奥壁の間で検図する</text>
  <text class="small" x="52" y="93">売場の奥行き方向に拡大。主通路は奥端のみを表示。</text>

  <path d="M53 119H150V192H53" fill="#e3eff3" stroke="#668693" stroke-width="1.5"/>
  <rect x="200.4" y="119" width="604.8" height="73" fill="#f3e4d1" stroke="#886745" stroke-width="1.5"/>
  <rect x="862.8" y="119" width="164.2" height="73" fill="#daceb8" stroke="#846f52" stroke-width="1.5"/>
  <text class="label" x="101" y="162" text-anchor="middle">主通路</text>
  <text class="label" x="502.8" y="162" text-anchor="middle">奥棚B · 奥行き 0.42 m</text>
  <text class="label" x="945" y="162" text-anchor="middle">仕上げパネル</text>

  <path class="guide" d="M150 192V264 M200.4 192V264 M805.2 192V264 M862.8 192V264"/>
  <path class="dim" d="M150 214v12 M200.4 214v12 M150 220h50.4 M805.2 214v12 M862.8 214v12 M805.2 220h57.6"/>
  <path d="M143 232h64v22h-64z M802 232h64v22h-64z" fill="#fff"/>
  <text class="gap" x="175.2" y="249" text-anchor="middle">35 mm</text>
  <text class="gap" x="834" y="249" text-anchor="middle">40 mm</text>

  <path class="dim" d="M53 264H1048" marker-end="url(#arrow)"/>
  <path class="dim" d="M150 259v10 M200.4 259v10 M805.2 259v10 M862.8 259v10"/>
  <text class="small" x="150" y="296" text-anchor="end">9.525</text>
  <text class="small" x="200.4" y="296">9.560</text>
  <text class="small" x="805.2" y="296" text-anchor="end">9.980</text>
  <text class="small" x="862.8" y="296">10.020</text>
  <text class="small" x="1048" y="296" text-anchor="end">奥行き d（m）</text>
</svg>
