name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run affected repository checks
        run: npm run check:affected -- --ci

      - name: Preserve selection and gate results
        if: ${{ always() && hashFiles('artifacts/ci/plan.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: affected-validation
          path: artifacts/ci/
          retention-days: 14
          if-no-files-found: error
